name: Release

# Push a tag such as v0.2.0: builds the signed installer, the portable zip and latest.json (the update manifest the app
# reads) and attaches them to a draft GitHub release.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY            the content of the update-signing key (the file ~/.decoy-signing/decoy.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password (leave empty if the key has none)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Validate translations
        run: npm run check-locales

      - name: Build installer, portable zip and update manifest
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/make-release.ps1

      - name: Attach files to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Decoy ${{ github.ref_name }}
          draft: true
          files: |
            release/Decoy_*_x64-setup.exe
            release/Decoy_*_x64-portable.zip
            release/latest.json
            release/SHA256SUMS.txt
